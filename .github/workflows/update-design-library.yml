name: Update Design Library

on:
  push:
    branches:
      - main
    paths:
      - 'css/**'
      - 'design-tokens.json'
      - 'scripts/extract-tokens.js'
      - 'scripts/generate-css.js'
  workflow_dispatch:

jobs:
  sync-tokens:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate CSS from tokens
        run: node scripts/generate-css.js

      - name: Extract tokens for documentation
        run: node scripts/extract-tokens.js

      - name: Check for changes
        id: check_changes
        run: |
          if git diff --quiet css/variables.css design-library/data/; then
            echo "changes=false" >> $GITHUB_OUTPUT
          else
            echo "changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push changes
        if: steps.check_changes.outputs.changes == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add css/variables.css design-library/data/
          git commit -m "Sync design tokens and CSS [automated]"
          git push
